# Include this file inside the `server` block that serves blog-view/dist.
# Example:
#   root /www/wwwroot/blog-view/dist;
#   include /www/wwwroot/blog-view/deploy/nginx-cache.conf;

location = /index.html {
	add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	try_files $uri =404;
}

location ^~ /assets/ {
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	try_files $uri =404;
}

location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
	add_header Cache-Control "public, max-age=2592000" always;
	try_files $uri =404;
}

# Vue Router history mode fallback.
# Direct visits like /home, /blog/1, /category/rust should return index.html,
# then the frontend router takes over.
location / {
	add_header Cache-Control "no-cache" always;
	try_files $uri $uri/ @router;
}

location @router {
	add_header Cache-Control "no-cache" always;
	rewrite ^.*$ /index.html last;
}
