# Include this file inside the `server` block that serves blog-view/dist.
# Example:
#   root /www/wwwroot/blog-view/dist;
#   include /www/wwwroot/blog-view/deploy/nginx-cache.conf;

location = /index.html {
	add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	try_files $uri =404;
}

location ^~ /assets/ {
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	try_files $uri =404;
}

location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
	add_header Cache-Control "public, max-age=2592000" always;
	try_files $uri =404;
}

location / {
	add_header Cache-Control "no-cache" always;
	try_files $uri $uri/ /index.html;
}
