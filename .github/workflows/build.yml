name: build
on:
  workflow_dispatch: {}
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build-backend:
    name: Build Backend (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
            archive-name: blog-api-linux.tar.gz
          - build: macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
            archive-name: blog-api-macos.tar.gz
          - build: windows
            os: windows-2022
            rust: stable-x86_64-msvc
            target: x86_64-pc-windows-msvc
            archive-name: blog-api-windows.7z
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            blog-api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('blog-api/Cargo.lock') }}

      - name: Build binary
        run: cd blog-api && cargo build --verbose --release --target ${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1

      - name: Strip binary (linux and macos)
        if: matrix.build == 'linux' || matrix.build == 'macos'
        run: strip "blog-api/target/${{ matrix.target }}/release/blog_api"

      - name: Build archive
        shell: bash
        run: |
          mkdir archive
          cp LICENSE README.MD archive/
          # 检查目录是否存在并复制
          if [ -d "blog-api/config" ]; then
            cp -r blog-api/config archive/
          fi
          cd archive
          if [ "${{ matrix.build }}" = "windows" ]; then
            # Windows 环境下使用更兼容的命令
            cp "../blog-api/target/${{ matrix.target }}/release/blog_api.exe" ./
            # 检查目录是否存在并复制，使用更兼容的路径处理
            if [ -d "../blog-api/config" ]; then
              mkdir -p ./config
              (cd "../blog-api/config" && tar -cf - .) | (cd ./config && tar -xf -)
            fi
            if [ -d "../blog-api/data" ]; then
              mkdir -p ./data
              (cd "../blog-api/data" && tar -cf - .) | (cd ./data && tar -xf -)
            fi
            # 使用 7z 创建归档文件，确保路径存在
            7z a "${{ matrix.archive-name }}" LICENSE README.MD config data blog_api.exe
          else
            cp "../blog-api/target/${{ matrix.target }}/release/blog_api" ./
            # 检查目录是否存在并复制
            if [ -d "../blog-api/config" ]; then
              cp -r "../blog-api/config" ./
            fi
            if [ -d "../blog-api/data" ]; then
              cp -r "../blog-api/data" ./
            fi
            tar -czf "${{ matrix.archive-name }}" LICENSE README.MD config data blog_api
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive-name }}
          path: archive/${{ matrix.archive-name }}

  build-frontend:
    name: Build Frontend (Vue3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [blog-cms, blog-view]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm install

      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-dist
          path: ${{ matrix.project }}/dist

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/blog-api-linux.tar.gz/blog-api-linux.tar.gz
            artifacts/blog-api-macos.tar.gz/blog-api-macos.tar.gz
            artifacts/blog-api-windows.7z/blog-api-windows.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}